<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Dictation test</title>
	<style>
		:root{--bg:#000000;--text:#ffffff;--muted:#9ca3af;--accent-2:#60a5fa}
		html,body{height:100%;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
		body{background:var(--bg);color:var(--text)}
		.app{position:fixed;inset:0;display:flex;flex-direction:column}
		h1{display:none;margin:0 0 6px 0;font-size:18px;color:var(--accent-2);font-weight:600}
		.instructions{color:var(--muted);font-size:13px;margin-bottom:12px;text-align:center}

		.stage{background:transparent;border-radius:0;padding:20px 18px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;overflow:hidden;transition:opacity 360ms ease, visibility 360ms ease}
		.stage.hidden{opacity:0;visibility:hidden;pointer-events:none}
		.stage.show{opacity:1;visibility:visible;pointer-events:auto}
		.line-wrap{display:flex;flex-direction:column;gap:18px;justify-content:center;align-items:flex-start;width:100%}
		.line{white-space:pre-wrap;font-size:36px;line-height:1.2;color:var(--text)}
		.caret{width:10px;height:36px;background:var(--accent-2);display:inline-block;margin-left:6px;vertical-align:middle;animation:blink 1s steps(2) infinite;border-radius:2px}
		@keyframes blink{50%{opacity:0}}
		.hidden-input{position:absolute;left:-9999px;top:auto;width:1px;height:1px;opacity:0}
		/* Splash styles */
		.splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:60;transition:opacity 360ms ease}
		.splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
		.splash-text{color:#ff2d95;font-size:28px;letter-spacing:4px;font-weight:700;text-transform:uppercase;text-shadow:0 6px 18px rgba(255,45,149,0.12)}
		.splash-button{margin-top:22px;padding:10px 28px;border:1px solid #ff2d95;color:#ff2d95;background:transparent;font-size:16px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:8px}
		.splash-button:hover{background:rgba(255,45,149,0.08)}
		.splash.hide{opacity:0}
		.rules{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 360ms ease, visibility 360ms ease}
		.rules.show{opacity:1;visibility:visible;pointer-events:auto}
		.rules.hidden{opacity:0;visibility:hidden;pointer-events:none}
		.rules-line{font-size:28px;line-height:1.4;color:var(--text);max-width:920px;min-height:90px;text-align:center;opacity:1;transition:opacity 200ms ease}
		.rules-line.fade-out{opacity:0}
		.countdown{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;font-size:120px;font-weight:700;color:var(--accent-2);opacity:0;visibility:hidden;pointer-events:none;transition:opacity 360ms ease, visibility 360ms ease}
		.countdown.show{opacity:1;visibility:visible;pointer-events:auto}
		.countdown.hidden{opacity:0;visibility:hidden;pointer-events:none}
		.goodbye{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 360ms ease, visibility 360ms ease}
		.goodbye.show{opacity:1;visibility:visible;pointer-events:auto}
		.goodbye.hidden{opacity:0;visibility:hidden;pointer-events:none}
		.goodbye-text{font-size:48px;font-weight:700;color:var(--text);letter-spacing:2px}
		.footer{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--muted);font-size:13px;transition:opacity 360ms ease, visibility 360ms ease}
		.footer.hidden{opacity:0;visibility:hidden;pointer-events:none}
		.footer.show{opacity:1;visibility:visible;pointer-events:auto}
		.controls button{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}
		.controls button:active{transform:translateY(1px)}
	</style>
</head>
<body>
	<!-- Splash screen: shown for 2 seconds on load -->
	<div id="splash" class="splash">
		<div class="splash-inner">
			<!-- Headphone SVG (simple) -->
			<svg width="140" height="140" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
				<path d="M12 3C7.031 3 3 7.031 3 12v3a3 3 0 0 0 3 3h.5a1.5 1.5 0 0 0 1.5-1.5V13A1 1 0 0 0 6 12a6 6 0 0 1 12 0 1 1 0 0 0-.5.5v3.5A1.5 1.5 0 0 0 19.5 18H20a3 3 0 0 0 3-3v-3c0-4.969-4.031-9-9-9z" fill="#ff2d95"/>
			</svg>
			<div class="splash-text">HEADPHONES REQUIRED</div>
			<button id="splashOk" class="splash-button">OK</button>
		</div>
	</div>
	<audio id="audioIntro" src="Audio/Dictation_Intro.wav" preload="auto"></audio>
	<audio id="audioTrack" src="Audio/Dictation.wav" preload="auto"></audio>
	<div id="rules" class="rules hidden" aria-live="polite"></div>
	<div id="countdown" class="countdown hidden"></div>
	<div id="goodbye" class="goodbye hidden"><div class="goodbye-text">Goodbye</div></div>
	<div class="app">
		<h1>Dictation test</h1>
		<div class="stage" id="stage" tabindex="0">
			<div class="line-wrap">
				<div id="linePrev" class="line" aria-hidden="true"></div>
				<div id="lineCurr" class="line"></div>
			</div>
			<textarea id="input" class="hidden-input" aria-hidden="false" autofocus></textarea>
		</div>

		<div class="footer">
			<div class="controls">
				<button id="clear">Clear</button>
			</div>
			<div id="stats">Lines: 0 · Words: 0</div>
		</div>
	</div>

	<script>
		const input = document.getElementById('input');
		const stage = document.getElementById('stage');
		const linePrev = document.getElementById('linePrev');
		const lineCurr = document.getElementById('lineCurr');
		const clearBtn = document.getElementById('clear');
		const stats = document.getElementById('stats');

		// Splash handling: wait for OK click before starting
		const splash = document.getElementById('splash');
		const splashOk = document.getElementById('splashOk');
		const audioIntro = document.getElementById('audioIntro');
		const audioTrack = document.getElementById('audioTrack');
		const rules = document.getElementById('rules');
		const countdown = document.getElementById('countdown');
		const goodbye = document.getElementById('goodbye');
		const footer = document.querySelector('.footer');

		// Create beep sound using Web Audio API
		function playBeep(freq=1000, duration=200){
			try {
				const audioContext = new (window.AudioContext || window.webkitAudioContext)();
				const oscillator = audioContext.createOscillator();
				const gainNode = audioContext.createGain();
				oscillator.connect(gainNode);
				gainNode.connect(audioContext.destination);
				oscillator.frequency.value = freq;
				oscillator.type = 'sine';
				gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
				gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);
				oscillator.start(audioContext.currentTime);
				oscillator.stop(audioContext.currentTime + duration / 1000);
			} catch(e){}
		}

		// Create horrific scream sound using Web Audio API
		function playFoghorn(){
			try {
				const audioContext = new (window.AudioContext || window.webkitAudioContext)();
				
				// Main scream oscillator
				const osc1 = audioContext.createOscillator();
				const osc2 = audioContext.createOscillator();
				const gainNode = audioContext.createGain();
				const gain1 = audioContext.createGain();
				const gain2 = audioContext.createGain();
				
				osc1.connect(gain1);
				osc2.connect(gain2);
				gain1.connect(gainNode);
				gain2.connect(gainNode);
				gainNode.connect(audioContext.destination);
				
				// Oscillator 1: High pitched scream (400Hz)
				osc1.type = 'sawtooth';
				osc1.frequency.setValueAtTime(400, audioContext.currentTime);
				osc1.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.2);
				osc1.frequency.exponentialRampToValueAtTime(350, audioContext.currentTime + 1);
				gain1.gain.setValueAtTime(0.4, audioContext.currentTime);
				
				// Oscillator 2: Harmonics (600Hz)
				osc2.type = 'square';
				osc2.frequency.setValueAtTime(600, audioContext.currentTime);
				osc2.frequency.exponentialRampToValueAtTime(400, audioContext.currentTime + 1);
				gain2.gain.setValueAtTime(0.3, audioContext.currentTime);
				
				// Master volume: loud attack, then decay
				gainNode.gain.setValueAtTime(0.7, audioContext.currentTime);
				gainNode.gain.exponentialRampToValueAtTime(0.02, audioContext.currentTime + 1.2);
				
				osc1.start(audioContext.currentTime);
				osc2.start(audioContext.currentTime);
				osc1.stop(audioContext.currentTime + 1.2);
				osc2.stop(audioContext.currentTime + 1.2);
			} catch(e){}
		}

		function showCountdown(){
			rules.classList.remove('show');
			countdown.classList.remove('hidden');
			countdown.classList.add('show');
			
			let count = 3;
			countdown.textContent = count;
			playBeep(800, 200);

			const countdownInterval = setInterval(()=>{
				count--;
				if(count > 0){
					countdown.textContent = count;
					playBeep(count === 1 ? 1200 : 800, 200);
				} else {
					clearInterval(countdownInterval);
					countdown.classList.remove('show');
					countdown.addEventListener('transitionend', ()=>{
						countdown.classList.add('hidden');
						startDictationAudio();
					}, {once:true});
				}
			}, 1000);
		}

		function startDictationAudio(){
			document.getElementById('stage').classList.remove('hidden');
			document.getElementById('stage').classList.add('show');
			if(footer){
				footer.classList.remove('hidden');
				footer.classList.add('show');
			}
			updateView();
			if(audioTrack){
				audioTrack.currentTime = 0;
				audioTrack.play().catch(()=>{});
				// Listen for when dictation ends
				audioTrack.addEventListener('ended', showGoodbye, {once:true});
			}
		}

		function showGoodbye(){
			document.getElementById('stage').classList.remove('show');
			document.getElementById('stage').classList.add('hidden');
			if(footer){
				footer.classList.remove('show');
				footer.classList.add('hidden');
			}
			goodbye.classList.remove('hidden');
			goodbye.classList.add('show');
			playFoghorn();
		}
		const rulesData = [
			'Hi ! Welcome to Dictation Test.',
			'This is an application meant for you to practice typing speed and correctness.',
			'All you have to do is type out the words you are hearing in your headphones.',
			'Your grade will be based on two key attributes: the speed of your typing, and the correctness of your grammar.',
			'Syntax errors may also deduct points, only in the case where they are unmistakeable.',
			'All that being said, best of luck ! You got this.'
		];
		const rulesTimings = [0.0, 3.0, 8.0, 12.0, 19.0, 25.0]; // start time for each line in seconds

		function showRules(){
			rules.innerHTML = '<div id="rules-current-line" class="rules-line"></div>';
			rules.classList.remove('hidden');
			rules.classList.add('show');
			document.getElementById('stage').classList.remove('show');
			document.getElementById('stage').classList.add('hidden');
			if(footer){
				footer.classList.remove('show');
				footer.classList.add('hidden');
			}
		}

		function updateRulesLine(){
			const currentTime = audioIntro.currentTime;
			const currentLineEl = document.getElementById('rules-current-line');
			if(!currentLineEl) return;

			// Find which line should be displayed based on current time
			let lineIdx = -1;
			for(let i = 0; i < rulesTimings.length; i++){
				if(currentTime >= rulesTimings[i]){
					lineIdx = i;
				} else {
					break;
				}
			}

			// Update content if line index changed
			if(lineIdx >= 0 && lineIdx < rulesData.length){
				if(currentLineEl.dataset.lineIdx !== String(lineIdx)){
					// Line changed: fade out, update, fade in
					currentLineEl.classList.add('fade-out');
					setTimeout(()=>{
						currentLineEl.textContent = rulesData[lineIdx];
						currentLineEl.dataset.lineIdx = lineIdx;
						currentLineEl.classList.remove('fade-out');
					}, 200);
				}
			}
		}

		function startDictation(){
			showCountdown();
		}

		function handleRulesTransitionEnd(){
			// This is no longer needed since we go directly to countdown
		}

		function startApp(){
			if(!splash) return;
			splash.classList.add('hide');
			splash.addEventListener('transitionend', ()=>{
				splash.style.display = 'none';
				showRules();
				if(audioIntro){
					audioIntro.currentTime = 0;
					audioIntro.play().catch(()=>{});
					// Update rules line every 100ms based on current audio time
					const rulesInterval = setInterval(updateRulesLine, 100);
					audioIntro.addEventListener('ended', ()=>{
						clearInterval(rulesInterval);
						startDictation();
					}, {once:true});
				} else {
					startDictation();
				}
			}, {once:true});
		}

		if(splashOk){
			splashOk.addEventListener('click', startApp);
		}

		// Representation: array of lines; each line is array of words (strings). currentToken holds currently typed characters (not yet committed by space)
		let lines = [[]];
		let currentToken = '';
		const WORDS_PER_LINE = 6;

		function updateView(){
			const lastTwo = lines.slice(-2);
			const prev = lastTwo.length === 2 ? lastTwo[0] : [];
			const curr = lastTwo.length === 2 ? lastTwo[1] : lastTwo[0] || [];

			// Render as plain text (no per-word wrappers)
			linePrev.textContent = prev.join(' ');

			// Current line: committed words + space + current token
			const committed = curr.join(' ');
			const middle = committed && currentToken ? committed + ' ' + currentToken : (committed || currentToken);
			lineCurr.textContent = middle || '\u00A0';

			// append caret element after the text node
			const caretEl = document.createElement('span');
			caretEl.className = 'caret';
			lineCurr.appendChild(caretEl);

			// stats
			const wordsTotal = lines.flat().length + (currentToken ? 1 : 0);
			stats.textContent = `Lines: ${lines.length} · Words: ${wordsTotal}`;

			input.focus();
			stage.scrollTop = stage.scrollHeight;
		}

		function commitTokenAsWord(token){
			if(token === '') return;
			lines[lines.length-1].push(token);
			currentToken = '';
			// auto-wrap if needed
			if(lines[lines.length-1].length >= WORDS_PER_LINE){
				lines.push([]);
			}
		}

		// handle printable input and control keys
		document.addEventListener('keydown', (e)=>{
			if(document.activeElement !== input) input.focus();

			// disable Enter creating lines
			if(e.key === 'Enter'){
				e.preventDefault();
				return;
			}

			if(e.key === 'Backspace'){
				e.preventDefault();
				if(currentToken.length > 0){
					currentToken = currentToken.slice(0, -1);
				} else if(lines[lines.length-1].length > 0){
					currentToken = lines[lines.length-1].pop();
				} else if(lines.length > 1){
					lines.pop();
					if(lines[lines.length-1].length > 0) currentToken = lines[lines.length-1].pop();
				}
				updateView();
				return;
			}

			// space commits current token as a word
			if(e.key === ' '){
				e.preventDefault();
				commitTokenAsWord(currentToken);
				updateView();
				return;
			}

			// printable char
			if(e.key.length === 1 && !e.ctrlKey && !e.metaKey){
				e.preventDefault();
				currentToken += e.key;
				updateView();
				return;
			}
		});

		// paste: treat as typing; split by whitespace into words and characters
		document.addEventListener('paste', (e)=>{
			e.preventDefault();
			const text = (e.clipboardData || window.clipboardData).getData('text');
			if(!text) return;
			const tokens = text.replace(/\r/g,'').split(/\s+/).filter(Boolean);
			if(currentToken) tokens[0] = currentToken + tokens[0];
			currentToken = '';
			tokens.forEach(t=>{ commitTokenAsWord(t); });
			updateView();
		});

		// clicking stage focuses
		stage.addEventListener('click', ()=> input.focus());

		clearBtn.addEventListener('click', ()=>{ lines = [[]]; currentToken = ''; updateView(); });

		// init
		updateView();
	</script>
</body>
</html>
