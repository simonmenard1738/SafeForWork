<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOU MUST VOTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #2a2a2a;
      --accent: #e5ff00;
      --accent2: #ff2d55;
      --text: #f0f0f0;
      --muted: #555;
      --card-bg: #141414;
      --win-glow: 0 0 30px rgba(229, 255, 0, 0.35);
      --lose-glow: 0 0 30px rgba(255, 45, 85, 0.25);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
    }

    /* ── HEADER ────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      border-bottom: 2px solid var(--border);
      background: #0c0c0c;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-family: 'Black Ops One', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
      line-height: 1;
    }
    .logo span { color: var(--accent2); }

    .vote-counter {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
    }
    .vote-counter strong {
      display: block;
      font-size: 1.5rem;
      color: var(--text);
      font-family: 'Black Ops One', sans-serif;
      letter-spacing: 0.05em;
    }

    /* ── CATEGORY TAG LINE ─────────────────────────────── */
    #matchup-info {
      text-align: center;
      padding: 14px 20px 0;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }
    #matchup-info .vs-cats {
      color: var(--accent);
    }

    /* ── ARENA ─────────────────────────────────────────── */
    #arena {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      padding: 28px 16px;
      max-width: 1080px;
      margin: 0 auto;
    }

    /* ── CARD ──────────────────────────────────────────── */
    .card {
      flex: 1;
      max-width: 440px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.12s;
      user-select: none;
    }
    .card:first-child { border-right: none; }

    .card:hover {
      border-color: var(--accent);
      transform: scaleY(1.008);
      z-index: 2;
    }

    .card.winner {
      border-color: var(--accent) !important;
      box-shadow: var(--win-glow);
    }
    .card.loser {
      border-color: var(--accent2) !important;
      box-shadow: var(--lose-glow);
      opacity: 0.6;
    }

    /* category pill */
    .cat-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 3px 8px;
      z-index: 3;
      backdrop-filter: blur(4px);
    }

    /* image container */
    .img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      transition: transform 0.25s;
    }
    .card:hover .img-wrap img { transform: scale(1.035); }

    /* fallback / loading state */
    .img-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      flex-direction: column;
      gap: 8px;
    }
    .img-placeholder .big-letter {
      font-family: 'Black Ops One', sans-serif;
      font-size: 5rem;
      color: #222;
      line-height: 1;
    }

    /* result overlay */
    .result-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Black Ops One', sans-serif;
      font-size: 2.8rem;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 10;
    }
    .card.winner .result-overlay {
      opacity: 1;
      color: var(--accent);
      text-shadow: 0 0 20px var(--accent);
      background: rgba(0,0,0,0.45);
    }
    .card.loser .result-overlay {
      opacity: 1;
      color: var(--accent2);
      text-shadow: 0 0 20px var(--accent2);
      background: rgba(0,0,0,0.45);
    }

    /* caption */
    .caption {
      padding: 16px 18px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }

    .entry-name {
      font-family: 'Black Ops One', sans-serif;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      line-height: 1.2;
      color: var(--text);
    }

    .entry-meta {
      margin-top: 5px;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .elo-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .elo-badge span { color: var(--text); }

    /* ── VS DIVIDER ────────────────────────────────────── */
    .vs-divider {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 56px;
      flex-shrink: 0;
      background: var(--bg);
      border-top: 1.5px solid var(--border);
      border-bottom: 1.5px solid var(--border);
      z-index: 5;
    }

    .vs-text {
      font-family: 'Black Ops One', sans-serif;
      font-size: 1.1rem;
      color: var(--accent2);
      letter-spacing: 0.1em;
      writing-mode: vertical-lr;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    /* ── CONTROLS ──────────────────────────────────────── */
    #controls {
      text-align: center;
      padding: 8px 20px 28px;
    }

    #skip-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 22px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #skip-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── FILTER BAR ────────────────────────────────────── */
    #filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      padding: 0 16px 24px;
      max-width: 1080px;
      margin: 0 auto;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 13px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .filter-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(229, 255, 0, 0.05);
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── LEADERBOARD ───────────────────────────────────── */
    #leaderboard-section {
      max-width: 1080px;
      margin: 0 auto 60px;
      padding: 0 16px;
    }

    .section-title {
      font-family: 'Black Ops One', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 16px;
    }
    .section-title span { color: var(--accent); }

    #leaderboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }

    .lb-item {
      background: var(--card-bg);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lb-rank {
      font-family: 'Black Ops One', sans-serif;
      font-size: 1.1rem;
      color: var(--border);
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .lb-item:nth-child(1) .lb-rank { color: var(--accent); }
    .lb-item:nth-child(2) .lb-rank { color: #ccc; }
    .lb-item:nth-child(3) .lb-rank { color: #c8964a; }

    .lb-thumb {
      width: 38px;
      height: 38px;
      object-fit: cover;
      background: #1a1a1a;
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .lb-info { flex: 1; min-width: 0; }
    .lb-name {
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .lb-cat {
      font-size: 0.58rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .lb-elo {
      font-family: 'Black Ops One', sans-serif;
      font-size: 0.85rem;
      color: var(--accent);
      flex-shrink: 0;
    }

    /* ── HISTORY FEED ──────────────────────────────────── */
    #history-section {
      max-width: 1080px;
      margin: 0 auto 60px;
      padding: 0 16px;
    }

    #history-feed {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      max-height: 320px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--card-bg);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
    }
    .history-winner { color: var(--accent); }
    .history-loser { color: var(--muted); text-align: right; }
    .history-sep { color: var(--accent2); text-align: center; font-size: 0.6rem; }

    /* ── TOAST ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent);
      color: #000;
      font-family: 'Black Ops One', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      padding: 10px 24px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── LOADING ───────────────────────────────────────── */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 999;
    }
    .loading-logo {
      font-family: 'Black Ops One', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      letter-spacing: 0.1em;
    }
    .loading-bar-wrap {
      width: 200px;
      height: 3px;
      background: var(--border);
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.4s;
    }
    .loading-msg {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── TRANSITION OVERLAY ────────────────────────────── */
    #transition-overlay {
      position: fixed;
      inset: 0;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      z-index: 500;
      pointer-events: none;
    }

    /* ── RESPONSIVE ────────────────────────────────────── */
    @media (max-width: 600px) {
      #arena { flex-direction: column; gap: 0; padding: 16px 10px; }
      .card:first-child { border-right: 1.5px solid var(--border); border-bottom: none; }
      .vs-divider { flex-direction: row; width: 100%; height: 40px; border-left: 1.5px solid var(--border); border-right: 1.5px solid var(--border); }
      .vs-text { writing-mode: unset; transform: none; }
      .card { max-width: 100%; }
      .img-wrap { aspect-ratio: 4/3; }
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loading-screen">
  <div class="loading-logo">YOU MUST VOTE</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-msg" id="loading-msg">Loading entries…</div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Transition overlay -->
<div id="transition-overlay"></div>

<!-- MAIN -->
<header>
  <div class="logo">You <span>Must</span> Vote</div>
  <div class="vote-counter">
    <strong id="total-votes">0</strong>
    TOTAL VOTES
  </div>
</header>

<div id="matchup-info">
  <span class="vs-cats" id="cat-left">—</span>
  &nbsp;vs&nbsp;
  <span class="vs-cats" id="cat-right">—</span>
</div>

<!-- Arena -->
<div id="arena">
  <div class="card" id="card-left" onclick="vote('left')">
    <div class="cat-pill" id="pill-left">—</div>
    <div class="img-wrap">
      <div class="img-placeholder" id="placeholder-left">
        <div class="big-letter" id="initial-left">?</div>
        <span>Loading…</span>
      </div>
      <img id="img-left" src="" alt="" style="display:none" />
      <div class="result-overlay" id="overlay-left"></div>
    </div>
    <div class="caption">
      <div class="entry-name" id="name-left">—</div>
      <div class="entry-meta" id="meta-left">—</div>
      <div class="elo-badge">ELO <span id="elo-left">1200</span></div>
    </div>
  </div>

  <div class="vs-divider">
    <div class="vs-text">VS</div>
  </div>

  <div class="card" id="card-right" onclick="vote('right')">
    <div class="cat-pill" id="pill-right">—</div>
    <div class="img-wrap">
      <div class="img-placeholder" id="placeholder-right">
        <div class="big-letter" id="initial-right">?</div>
        <span>Loading…</span>
      </div>
      <img id="img-right" src="" alt="" style="display:none" />
      <div class="result-overlay" id="overlay-right"></div>
    </div>
    <div class="caption">
      <div class="entry-name" id="name-right">—</div>
      <div class="entry-meta" id="meta-right">—</div>
      <div class="elo-badge">ELO <span id="elo-right">1200</span></div>
    </div>
  </div>
</div>

<div id="controls">
  <button id="skip-btn" onclick="nextMatchup()">↻ SKIP</button>
</div>

<!-- Category filter -->
<div id="filter-bar"></div>

<!-- Leaderboard -->
<div id="leaderboard-section">
  <div class="section-title">🏆 <span>Top Rated</span> Entries</div>
  <div id="leaderboard"></div>
</div>

<!-- History -->
<div id="history-section">
  <div class="section-title">⚡ <span>Recent</span> Battles</div>
  <div id="history-feed"></div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────
let entries = [];
let eloMap = {}; // name -> elo
let totalVotes = 0;
let history = [];
let currentLeft = null;
let currentRight = null;
let canVote = true;
let activeFilter = 'ALL';

const CATEGORIES = ['ALL','People','Places','Body Parts','Concepts','Companies','Foods','Subreddits','YouTube Videos','Cars','Things','Animals'];

// ── WIKIPEDIA IMAGE RESOLUTION ─────────────────────────────────────────
// Converts a FilePath URL to a proper thumbnail via Wikipedia API
function wikiThumb(url, size = 500) {
  if (!url) return '';
  // Extract filename from Special:FilePath/...
  const match = url.match(/Special:FilePath\/(.+)$/i);
  if (!match) return url;
  const filename = decodeURIComponent(match[1]);
  const encoded = encodeURIComponent(filename).replace(/%20/g, '_').replace(/%2F/g, '/');
  return `https://en.wikipedia.org/w/index.php?title=Special:Redirect/file/${encoded}&width=${size}`;
}

// ── LOAD DATA ─────────────────────────────────────────────────────────
async function loadData() {
  const bar = document.getElementById('loading-bar');
  const msg = document.getElementById('loading-msg');

  try {
    bar.style.width = '30%';
    msg.textContent = 'Fetching entries…';

    // Try to load local data.json — works when served together
    let data;
    try {
      const res = await fetch('data.json');
      data = await res.json();
    } catch(e) {
      // Fallback: use inline sample if fetch fails (e.g. opened as file://)
      data = FALLBACK_DATA;
    }

    bar.style.width = '70%';
    msg.textContent = 'Building arena…';
    entries = data;

    // Initialize ELO for all entries
    entries.forEach(e => {
      const key = e.name + '|' + e.category;
      if (!eloMap[key]) eloMap[key] = 1200;
    });

    // Load persisted data
    loadPersisted();

    bar.style.width = '100%';
    msg.textContent = 'Ready!';

    setTimeout(() => {
      document.getElementById('loading-screen').style.display = 'none';
      buildFilterBar();
      nextMatchup();
      renderLeaderboard();
    }, 300);

  } catch(err) {
    msg.textContent = 'Error: ' + err.message;
  }
}

// ── PERSISTENCE ───────────────────────────────────────────────────────
function loadPersisted() {
  try {
    const saved = JSON.parse(localStorage.getItem('ymv_state') || '{}');
    if (saved.eloMap) {
      Object.assign(eloMap, saved.eloMap);
    }
    totalVotes = saved.totalVotes || 0;
    history = saved.history || [];
    document.getElementById('total-votes').textContent = totalVotes;
    renderHistory();
  } catch(e) {}
}

function persist() {
  try {
    localStorage.setItem('ymv_state', JSON.stringify({ eloMap, totalVotes, history: history.slice(0, 200) }));
  } catch(e) {}
}

// ── FILTER BAR ────────────────────────────────────────────────────────
function buildFilterBar() {
  const bar = document.getElementById('filter-bar');
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === 'ALL' ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => setFilter(cat);
    bar.appendChild(btn);
  });
}

function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === cat);
  });
  nextMatchup();
  renderLeaderboard();
}

function filteredEntries() {
  if (activeFilter === 'ALL') return entries;
  return entries.filter(e => e.category === activeFilter);
}

// ── MATCHUP ───────────────────────────────────────────────────────────
function pickTwo() {
  const pool = filteredEntries();
  if (pool.length < 2) return [entries[0], entries[1]]; // fallback

  // Group by category
  const cats = [...new Set(pool.map(e => e.category))];

  // Pick two DIFFERENT categories (unless only one category active)
  let catA, catB;
  if (cats.length >= 2 && activeFilter === 'ALL') {
    const shuffledCats = shuffle([...cats]);
    catA = shuffledCats[0];
    catB = shuffledCats[1];
  } else {
    // Same category filter — just pick random two entries
    catA = cats[0];
    catB = cats[0];
  }

  const poolA = pool.filter(e => e.category === catA);
  const poolB = pool.filter(e => e.category === catB);

  const a = poolA[Math.floor(Math.random() * poolA.length)];
  let b;
  if (catA !== catB) {
    b = poolB[Math.floor(Math.random() * poolB.length)];
  } else {
    // Same category, make sure we pick a different entry
    const remaining = poolB.filter(e => e.name !== a.name);
    if (remaining.length === 0) return [entries[0], entries[1]];
    b = remaining[Math.floor(Math.random() * remaining.length)];
  }
  return [a, b];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

async function nextMatchup() {
  if (!entries.length) return;
  canVote = true;

  // Reset card states
  ['left','right'].forEach(side => {
    document.getElementById('card-' + side).classList.remove('winner','loser');
    document.getElementById('overlay-' + side).textContent = '';
  });

  const [a, b] = pickTwo();
  currentLeft = a;
  currentRight = b;

  renderCard('left', a);
  renderCard('right', b);

  // Update matchup info
  document.getElementById('cat-left').textContent = a.category.toUpperCase();
  document.getElementById('cat-right').textContent = b.category.toUpperCase();
}

function renderCard(side, entry) {
  const key = entry.name + '|' + entry.category;
  document.getElementById('pill-' + side).textContent = entry.category;
  document.getElementById('name-' + side).textContent = entry.name;
  document.getElementById('meta-' + side).textContent = entry.category.toUpperCase();
  document.getElementById('elo-' + side).textContent = Math.round(eloMap[key] || 1200);
  document.getElementById('initial-' + side).textContent = entry.name.charAt(0).toUpperCase();

  // Show placeholder while image loads
  const placeholder = document.getElementById('placeholder-' + side);
  const img = document.getElementById('img-' + side);
  placeholder.style.display = 'flex';
  img.style.display = 'none';
  img.src = '';

  // Resolve Wikipedia thumbnail
  const thumbUrl = wikiThumb(entry.image, 500);
  const newImg = new Image();
  newImg.onload = () => {
    img.src = thumbUrl;
    img.alt = entry.name;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  };
  newImg.onerror = () => {
    // Keep placeholder visible on error
    placeholder.querySelector('span').textContent = 'No image';
  };
  newImg.src = thumbUrl;
}

// ── VOTE ──────────────────────────────────────────────────────────────
function vote(winner) {
  if (!canVote) return;
  canVote = false;

  const winEntry = winner === 'left' ? currentLeft : currentRight;
  const loseEntry = winner === 'left' ? currentRight : currentLeft;
  const winSide = winner;
  const loseSide = winner === 'left' ? 'right' : 'left';

  // ELO update
  const winKey = winEntry.name + '|' + winEntry.category;
  const loseKey = loseEntry.name + '|' + loseEntry.category;
  const [newWin, newLose] = calcElo(eloMap[winKey] || 1200, eloMap[loseKey] || 1200);
  eloMap[winKey] = newWin;
  eloMap[loseKey] = newLose;

  // Update ELO display
  document.getElementById('elo-' + winSide).textContent = Math.round(newWin);
  document.getElementById('elo-' + loseSide).textContent = Math.round(newLose);

  // Card animations
  document.getElementById('card-' + winSide).classList.add('winner');
  document.getElementById('card-' + loseSide).classList.add('loser');

  // Vote count
  totalVotes++;
  document.getElementById('total-votes').textContent = totalVotes;

  // History
  history.unshift({ winner: winEntry.name, loser: loseEntry.name, winCat: winEntry.category, loseCat: loseEntry.category });
  renderHistory();

  // Persist
  persist();
  renderLeaderboard();

  showToast(winEntry.name.toUpperCase() + ' WINS');

  // Auto-advance
  setTimeout(() => nextMatchup(), 1400);
}

// ── ELO ───────────────────────────────────────────────────────────────
function calcElo(rA, rB, k = 32) {
  const expA = 1 / (1 + Math.pow(10, (rB - rA) / 400));
  const newA = rA + k * (1 - expA);
  const newB = rB + k * (0 - (1 - expA));
  return [Math.round(newA), Math.round(newB)];
}

// ── LEADERBOARD ───────────────────────────────────────────────────────
function renderLeaderboard() {
  const lb = document.getElementById('leaderboard');
  lb.innerHTML = '';

  const pool = filteredEntries();
  const ranked = [...pool].sort((a, b) => {
    const ka = a.name + '|' + a.category;
    const kb = b.name + '|' + b.category;
    return (eloMap[kb] || 1200) - (eloMap[ka] || 1200);
  }).slice(0, 30);

  ranked.forEach((entry, i) => {
    const key = entry.name + '|' + entry.category;
    const elo = Math.round(eloMap[key] || 1200);
    const div = document.createElement('div');
    div.className = 'lb-item';
    const thumbUrl = wikiThumb(entry.image, 80);
    div.innerHTML = `
      <div class="lb-rank">${i + 1}</div>
      <img class="lb-thumb" src="${thumbUrl}" alt="${entry.name}" onerror="this.style.visibility='hidden'" />
      <div class="lb-info">
        <div class="lb-name">${entry.name}</div>
        <div class="lb-cat">${entry.category}</div>
      </div>
      <div class="lb-elo">${elo}</div>
    `;
    lb.appendChild(div);
  });
}

// ── HISTORY ───────────────────────────────────────────────────────────
function renderHistory() {
  const feed = document.getElementById('history-feed');
  feed.innerHTML = '';
  history.slice(0, 50).forEach(h => {
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="history-winner">▲ ${h.winner} <span style="color:var(--muted);font-size:0.58rem">${h.winCat}</span></div>
      <div class="history-sep">beat</div>
      <div class="history-loser"><span style="color:var(--muted);font-size:0.58rem">${h.loseCat}</span> ${h.loser} ▼</div>
    `;
    feed.appendChild(div);
  });
}

// ── TOAST ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') vote('left');
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') vote('right');
  if (e.key === 's' || e.key === 'S' || e.key === ' ') { e.preventDefault(); nextMatchup(); }
});
